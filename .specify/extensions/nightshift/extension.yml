schema_version: "1.0"

extension:
  id: nightshift
  name: "Spec Kit Nightshift"
  version: "2.0.3"
  description: "Work packages and unattended batch delivery for Spec Kit: one piece per tasks.md phase, approved in one step by day, run by night with one fresh orchestrator process per piece, handed over as one PR with a preview"
  author: Kasper Honore
  repository: https://github.com/KasperHonore/spec-kit-nightshift
  license: MIT

requires:
  # Pinned to the Spec Kit we inspected (838f1184, 1.0.14.dev0). The py-only
  # script fallback (integrations/base.py select_script_variant) and
  # config.defaults handling are verified there.
  speckit_version: ">=1.0.13"
  tools:
    - name: git
      required: true
      description: "Branches, worktrees and the origin remote for runs and publishing issues"
    - name: gh
      required: false
      description: "GitHub CLI: issues, PRs and comments (ready go, the run)"
      install_url: "https://cli.github.com/"

provides:
  commands:
    - name: speckit.nightshift.ready
      file: commands/speckit.nightshift.ready.md
      description: "Check a feature is ready, show the run contract and issue plan, then approve and publish on the owner's go (re-running go re-approves)"

    - name: speckit.nightshift.run
      file: commands/speckit.nightshift.run.md
      description: "Dispatch an approved batch unattended: one fresh orchestrator process per piece, answers and converge rounds, then one PR with a preview"

  templates:
    - name: issue-parent
      file: templates/issue-parent.md
      description: "Parent issue body for a feature"
    - name: issue-phase
      file: templates/issue-phase.md
      description: "Sub-issue body for one piece"
    - name: run-contract
      file: templates/run-contract.md
      description: "Run contract rendered when the batch is approved (the goal of the night)"
    - name: delivery-record
      file: templates/delivery-record.yml
      description: "Annotated example of the delivery record"

    - name: pr-feature
      file: templates/pr-feature.md
      description: "Feature PR body: decisions, summary, evidence, merge danger, criteria, changes, gaps"
    - name: pr-phase
      file: templates/pr-phase.md
      description: "Phase PR body"
    - name: acceptance-comment
      file: templates/acceptance-comment.md
      description: "Acceptance comment bound to a SHA"
    - name: blocker-question
      file: templates/blocker-question.md
      description: "Blocker question on a sub-issue"
    - name: dashboard
      file: templates/dashboard.html
      description: "Run dashboard"
    - name: prompt-piece
      file: templates/prompt-piece.md
      description: "Piece orchestrator prompt (one fresh process per piece)"
    - name: prompt-builder
      file: templates/prompt-builder.md
      description: "Builder prompt"
    - name: prompt-critic
      file: templates/prompt-critic.md
      description: "Fresh, read-only critic prompt (one per review round)"

  scripts:
    - name: ready
      file: scripts/python/ready.py
      runtimes: [python]
    - name: piece
      file: scripts/python/piece.py
      runtimes: [python]
    - name: preflight
      file: scripts/python/preflight.py
      runtimes: [python]
    - name: state
      file: scripts/python/state.py
      runtimes: [python]
    - name: log
      file: scripts/python/log.py
      runtimes: [python]
    - name: grounding
      file: scripts/python/grounding.py
      runtimes: [python]
    - name: phase
      file: scripts/python/phase.py
      runtimes: [python]
    - name: postconditions
      file: scripts/python/postconditions.py
      runtimes: [python]
    - name: checks
      file: scripts/python/checks.py
      runtimes: [python]
    - name: verdict
      file: scripts/python/verdict.py
      runtimes: [python]
    - name: phase-merge
      file: scripts/python/phase_merge.py
      runtimes: [python]
    - name: blocker
      file: scripts/python/blocker.py
      runtimes: [python]
    - name: handover
      file: scripts/python/handover.py
      runtimes: [python]
    - name: render-dashboard
      file: scripts/python/render_dashboard.py
      runtimes: [python]
    - name: found
      file: scripts/python/found.py
      runtimes: [python]

  config:
    - name: nightshift-config.yml
      template: nightshift-config.yml
      description: "Nightshift defaults: rounds, budgets, check and preview commands, converge rounds"
      required: false

config:
  # Documentation only: the scripts read nightshift_config.DEFAULTS, which this mirrors
  # (tests/test_version.py keeps them equal).
  defaults:
    max_rounds: 3
    wall_clock: 8h
    phase_budget: 2h
    review_budget: 1h
    checks: []
    preview:
      command: []
      health_url: ""
      health_timeout: 30
    cli:
      piece: claude
      builder: claude
      critic: claude
      converge: claude
    converge:
      max_rounds: 2
    gate_paths:
      - "Makefile"
      - ".github/workflows/**"
      - "nightshift-config.yml"
      - ".specify/extensions/nightshift/**"
      - ".specify/delivery/**"
    min_free_mb:
      warn: 1536
      refuse: 500
      probe: 32
    ci:
      require: true
      wait_timeout: 30m
      poll_interval: 30s

tags:
  - "delivery"
  - "issues"
  - "workflow"
  - "automation"
