schema_version: "1.0"

extension:
  id: nightshift
  name: "Spec Kit Nightshift"
  version: "1.1.3"
  description: "Work packages and unattended batch delivery for Spec Kit: derive one piece per tasks.md phase, get it ready and approve it in one step, run it unattended, hand over one PR with a preview"
  author: Kasper Honore
  repository: https://github.com/KasperHonore/spec-kit-nightshift
  license: MIT

requires:
  # Pinned to the Spec Kit we inspected (838f1184, 1.0.14.dev0). The py-only
  # script fallback (integrations/base.py select_script_variant) and
  # config.defaults handling are verified there.
  speckit_version: ">=1.0.13"
  tools:
    - name: git
      required: true
      description: "Branches, worktrees and the origin remote for runs and publishing issues"
    - name: gh
      required: false
      description: "GitHub CLI: issues, PRs and comments (ready go, the run)"
      install_url: "https://cli.github.com/"

provides:
  commands:
    - name: speckit.nightshift.ready
      file: commands/speckit.nightshift.ready.md
      description: "Validate, recommend a loop per piece, show the run contract and issue plan, then approve and publish on the owner's go"

    - name: speckit.nightshift.run
      file: commands/speckit.nightshift.run.md
      description: "Run an approved batch unattended: build, check, review and integrate each piece, then hand over one PR with a preview"

  templates:
    - name: issue-parent
      file: templates/issue-parent.md
      description: "Parent issue body for a feature"
    - name: issue-phase
      file: templates/issue-phase.md
      description: "Sub-issue body for one piece"
    - name: issue-bug
      file: templates/issue-bug.md
      description: "Issue body for a reported bug"
    - name: run-contract
      file: templates/run-contract.md
      description: "Run contract rendered and frozen when the batch is approved"
    - name: delivery-record
      file: templates/delivery-record.yml
      description: "Annotated example of the delivery record"

    - name: pr-feature
      file: templates/pr-feature.md
      description: "Feature PR body"
    - name: pr-phase
      file: templates/pr-phase.md
      description: "Phase PR body"
    - name: acceptance-comment
      file: templates/acceptance-comment.md
      description: "Acceptance comment bound to a SHA"
    - name: blocker-question
      file: templates/blocker-question.md
      description: "Blocker question on a sub-issue"
    - name: dashboard
      file: templates/dashboard.html
      description: "Run dashboard"
    - name: prompt-builder
      file: templates/prompt-builder.md
      description: "Builder prompt"
    - name: prompt-critic
      file: templates/prompt-critic.md
      description: "Fresh, read-only critic prompt (one per review round)"
    - name: prompt-fix-builder
      file: templates/prompt-fix-builder.md
      description: "Builder prompt for a fix piece (reproduction first)"
    - name: pr-fix
      file: templates/pr-fix.md
      description: "Bug-run PR body into main"

  scripts:
    - name: derive
      file: scripts/python/derive.py
      runtimes: [python]
    - name: validate
      file: scripts/python/validate.py
      runtimes: [python]
    - name: shape
      file: scripts/python/shape.py
      runtimes: [python]
    - name: publish
      file: scripts/python/publish.py
      runtimes: [python]
    - name: ready
      file: scripts/python/ready.py
      runtimes: [python]
    - name: preflight
      file: scripts/python/preflight.py
      runtimes: [python]
    - name: state
      file: scripts/python/state.py
      runtimes: [python]
    - name: log
      file: scripts/python/log.py
      runtimes: [python]
    - name: phase
      file: scripts/python/phase.py
      runtimes: [python]
    - name: postconditions
      file: scripts/python/postconditions.py
      runtimes: [python]
    - name: checks
      file: scripts/python/checks.py
      runtimes: [python]
    - name: verdict
      file: scripts/python/verdict.py
      runtimes: [python]
    - name: phase-merge
      file: scripts/python/phase_merge.py
      runtimes: [python]
    - name: blocker
      file: scripts/python/blocker.py
      runtimes: [python]
    - name: handover
      file: scripts/python/handover.py
      runtimes: [python]
    - name: render-dashboard
      file: scripts/python/render_dashboard.py
      runtimes: [python]
    - name: found
      file: scripts/python/found.py
      runtimes: [python]
    - name: feedback
      file: scripts/python/feedback.py
      runtimes: [python]

  config:
    - name: nightshift-config.yml
      template: nightshift-config.yml
      description: "Nightshift defaults: rounds, budgets, check and preview commands"
      required: false

config:
  defaults:
    max_rounds: 3
    wall_clock: 8h
    phase_budget: 2h
    review_budget: 1h

tags:
  - "delivery"
  - "issues"
  - "workflow"
  - "automation"
